<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc">
  <title id="title">PS5 DualSense Wireless Controller</title>
  <desc id="desc">PlayStation 5 DualSense 무선 컨트롤러(화이트)의 정면 일러스트</desc>

  <defs>
    <!-- 색상 -->
    <linearGradient id="g-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f3f3f6"/>
      <stop offset="1" stop-color="#d8d8de"/>
    </linearGradient>
    <linearGradient id="g-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.35" stop-color="#1d1d21"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="g-trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#c9c9d0"/>
    </linearGradient>
    <linearGradient id="g-bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f3"/>
      <stop offset="1" stop-color="#b9b9c1"/>
    </linearGradient>
    <linearGradient id="g-touchpad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#e1e1e6"/>
    </linearGradient>
    <linearGradient id="g-button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e2e7"/>
    </linearGradient>
    <radialGradient id="g-well" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.78" stop-color="#040405"/>
      <stop offset="1" stop-color="#34343a"/>
    </radialGradient>
    <radialGradient id="g-cap" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3e3e44"/>
      <stop offset="0.75" stop-color="#232327"/>
      <stop offset="1" stop-color="#121214"/>
    </radialGradient>
    <radialGradient id="g-dish" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f2f34"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </radialGradient>
    <pattern id="p-holes" width="6" height="6" patternUnits="userSpaceOnUse" x="358" y="243">
      <circle cx="3" cy="3" r="1.3" fill="#070708"/>
    </pattern>

    <!-- 필터 -->
    <filter id="f-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="6" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-small-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="f-glow" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- 본체 실루엣과 검은 내부 패널 -->
    <path id="body" d="M400,126 C350,126 300,117 245,117 C198,117 160,125 145,150 C131,172 125,195 125,220 C125,250 130,275 130,300 C130,335 110,372 110,408 C110,440 128,459 162,458 C198,458 226,450 236,434 C248,412 256,390 264,370 C276,350 330,342 400,342 C470,342 524,350 536,370 C544,390 552,412 564,434 C574,450 602,458 638,458 C672,459 690,440 690,408 C690,372 670,335 670,300 C670,275 675,250 675,220 C675,195 669,172 655,150 C640,125 602,117 555,117 C500,117 450,126 400,126 Z"/>
    <path id="inner" d="M222,475 C232,420 228,330 226,290 C226,250 252,220 290,217 C300,217 308,220 316,224 L484,224 C492,220 500,217 510,217 C548,220 574,250 574,290 C572,330 568,420 578,475 L578,560 L222,560 Z"/>
    <clipPath id="c-body"><path d="M400,126 C350,126 300,117 245,117 C198,117 160,125 145,150 C131,172 125,195 125,220 C125,250 130,275 130,300 C130,335 110,372 110,408 C110,440 128,459 162,458 C198,458 226,450 236,434 C248,412 256,390 264,370 C276,350 330,342 400,342 C470,342 524,350 536,370 C544,390 552,412 564,434 C574,450 602,458 638,458 C672,459 690,440 690,408 C690,372 670,335 670,300 C670,275 675,250 675,220 C675,195 669,172 655,150 C640,125 602,117 555,117 C500,117 450,126 400,126 Z"/></clipPath>
    <clipPath id="c-inner"><path d="M222,475 C232,420 228,330 226,290 C226,250 252,220 290,217 C300,217 308,220 316,224 L484,224 C492,220 500,217 510,217 C548,220 574,250 574,290 C572,330 568,420 578,475 L578,560 L222,560 Z"/></clipPath>

    <!-- 왼쪽 부품들 (오른쪽은 좌우 반전해서 재사용) -->
    <path id="trigger-l" d="M160,150 C155,108 170,86 206,86 L250,86 C280,86 292,106 290,150 Z" fill="url(#g-trigger)" stroke="#b8b8bf" stroke-width="1"/>
    <path id="bumper-l" d="M166,150 C165,120 178,106 208,106 L258,106 C284,106 292,118 291,150 Z" fill="url(#g-bumper)" stroke="#aeaeb6" stroke-width="1"/>
    <g id="stick-l">
      <circle cx="290" cy="285" r="46" fill="url(#g-well)"/>
      <circle cx="290" cy="285" r="34" fill="url(#g-cap)"/>
      <circle cx="290" cy="285" r="30" fill="none" stroke="#3b3b41" stroke-width="3" opacity="0.9"/>
      <circle cx="290" cy="285" r="25" fill="url(#g-dish)"/>
      <ellipse cx="290" cy="266" rx="16" ry="4" fill="#ffffff" opacity="0.06"/>
    </g>
    <g id="lightbar-l" fill="none" stroke-linecap="round">
      <path d="M301,147 C301,180 304,206 309,219" stroke="#4fb0ff" stroke-width="7" opacity="0.55" filter="url(#f-glow)"/>
      <path d="M301,147 C301,180 304,206 309,219" stroke="#a9dcff" stroke-width="3.2"/>
    </g>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="400" cy="462" rx="250" ry="14" fill="#000" opacity="0.10" filter="url(#f-blur)"/>

  <!-- L2 / R2 트리거 -->
  <use href="#trigger-l"/>
  <use href="#trigger-l" transform="matrix(-1 0 0 1 800 0)"/>

  <!-- L1 / R1 범퍼 -->
  <g filter="url(#f-small-shadow)">
    <use href="#bumper-l"/>
    <use href="#bumper-l" transform="matrix(-1 0 0 1 800 0)"/>
  </g>

  <!-- 본체 (화이트 셸) -->
  <g filter="url(#f-shadow)">
    <use href="#body" fill="url(#g-shell)" stroke="#c4c4cb" stroke-width="1.2"/>
  </g>
  <g clip-path="url(#c-body)">
    <use href="#body" fill="none" stroke="#000" stroke-width="22" opacity="0.07" filter="url(#f-blur)"/>
  </g>

  <!-- 검은 내부 패널 -->
  <g clip-path="url(#c-body)">
    <use href="#inner" fill="url(#g-inner)"/>
    <g clip-path="url(#c-inner)">
      <use href="#inner" fill="none" stroke="#000" stroke-width="6" opacity="0.5" filter="url(#f-glow)"/>
      <!-- 검은 패널 아래쪽 가장자리의 옅은 테두리 (어두운 배경에서도 윤곽이 보이도록) -->
      <use href="#body" fill="none" stroke="#45454d" stroke-width="2.5"/>
    </g>
  </g>

  <!-- USB-C 포트 -->
  <rect x="389" y="121" width="22" height="6" rx="3" fill="#2a2a2f"/>

  <!-- 아날로그 스틱 -->
  <use href="#stick-l"/>
  <use href="#stick-l" transform="matrix(-1 0 0 1 800 0)"/>

  <!-- 터치패드 + 라이트바 -->
  <path d="M319,134 L481,134 C491,134 496,139 496,149 C496,180 492,205 488,218 C486,224 482,226 476,226 L324,226 C318,226 314,224 312,218 C308,205 304,180 304,149 C304,139 309,134 319,134 Z" fill="url(#g-touchpad)" stroke="#c0c0c8" stroke-width="1"/>
  <use href="#lightbar-l"/>
  <use href="#lightbar-l" transform="matrix(-1 0 0 1 800 0)"/>

  <!-- 크리에이트 / 옵션 버튼 -->
  <g transform="translate(288,160) rotate(70)">
    <rect x="-14" y="-5.5" width="28" height="11" rx="5.5" fill="url(#g-button)" stroke="#b9b9c1" stroke-width="1"/>
    <path d="M-4,-3 L-4,3 M0,-3 L0,3 M4,-1 L4,3" fill="none" stroke="#55555c" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(512,160) rotate(-70)">
    <rect x="-14" y="-5.5" width="28" height="11" rx="5.5" fill="url(#g-button)" stroke="#b9b9c1" stroke-width="1"/>
    <path d="M-4,-3 L-4,3 M0,-3 L0,3 M4,-3 L4,3" fill="none" stroke="#55555c" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 방향키 -->
  <g filter="url(#f-small-shadow)">
    <path d="M189,156 A6,6 0 0 1 195,150 L213,150 A6,6 0 0 1 219,156 L219,185 L248,185 A6,6 0 0 1 254,191 L254,209 A6,6 0 0 1 248,215 L219,215 L219,244 A6,6 0 0 1 213,250 L195,250 A6,6 0 0 1 189,244 L189,215 L160,215 A6,6 0 0 1 154,209 L154,191 A6,6 0 0 1 160,185 L189,185 Z" fill="url(#g-button)" stroke="#b9b9c1" stroke-width="1"/>
  </g>
  <circle cx="204" cy="200" r="11" fill="#e6e6eb" stroke="#cdcdd3" stroke-width="1"/>
  <g fill="#d9d9df">
    <path d="M204,160 L209,168 L199,168 Z"/>
    <path d="M204,240 L209,232 L199,232 Z"/>
    <path d="M164,200 L172,195 L172,205 Z"/>
    <path d="M244,200 L236,195 L236,205 Z"/>
  </g>

  <!-- 액션 버튼 (△ ○ ✕ □) -->
  <g filter="url(#f-small-shadow)" fill="url(#g-button)" stroke="#b9b9c1" stroke-width="1">
    <circle cx="596" cy="160" r="16"/>
    <circle cx="636" cy="200" r="16"/>
    <circle cx="596" cy="240" r="16"/>
    <circle cx="556" cy="200" r="16"/>
  </g>
  <g fill="none" stroke="#4a4a51" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M596,152.5 L604.5,167.5 L587.5,167.5 Z"/>
    <circle cx="636" cy="200" r="7.2"/>
    <path d="M590.5,234.5 L601.5,245.5 M601.5,234.5 L590.5,245.5"/>
    <rect x="549.5" y="193.5" width="13" height="13" rx="1.2"/>
  </g>

  <!-- 플레이어 표시등 -->
  <g>
    <circle cx="388" cy="233" r="1.5" fill="#3a3a40"/>
    <circle cx="394" cy="233" r="1.5" fill="#3a3a40"/>
    <circle cx="400" cy="233" r="3.5" fill="#ffffff" opacity="0.3" filter="url(#f-glow)"/>
    <circle cx="400" cy="233" r="1.6" fill="#ffffff"/>
    <circle cx="406" cy="233" r="1.5" fill="#3a3a40"/>
    <circle cx="412" cy="233" r="1.5" fill="#3a3a40"/>
  </g>

  <!-- 스피커 그릴 -->
  <rect x="358" y="243" width="84" height="18" fill="url(#p-holes)"/>

  <!-- PS 버튼 -->
  <g transform="translate(400,291) scale(1.6) translate(-12,-12.4)" fill="#45454c" stroke="#5c5c64" stroke-width="0.5" stroke-linejoin="round">
    <path d="M9,2.6 L9,20.1 L12.9,21.4 L12.9,6.7 C12.9,5.9 13.3,5.5 13.9,5.7 C14.5,5.9 14.7,6.5 14.7,7.2 L14.7,13.1 C17.1,14.3 19,13.1 19,9.9 C19,6.7 17.9,5.2 14.6,4.1 C13.3,3.7 10.7,2.9 9,2.6 Z"/>
    <path d="M13.6,18.8 L19.9,16.6 C20.6,16.3 20.8,16 20.2,15.7 C19.6,15.5 18.5,15.6 17.8,15.9 L13.6,17.4 L13.6,15 L13.9,14.9 C13.9,14.9 15.1,14.5 16.8,14.3 C18.5,14.1 20.6,14.3 22.2,14.9 C24,15.5 24.2,16.4 23.8,17 C23.3,17.6 22.2,18 22.2,18 L13.6,21.2 Z"/>
    <path d="M1.8,18.6 C-0.1,18.1 -0.4,16.9 0.5,16.3 C1.3,15.7 2.6,15.2 2.6,15.2 L8.2,13.2 L8.2,15.5 L4.2,17 C3.5,17.3 3.4,17.6 4,17.8 C4.5,18 5.6,18 6.3,17.7 L8.2,17 L8.2,19.1 C8.1,19.1 8,19.1 7.8,19.1 C6,19.4 3.9,19.3 1.8,18.6 Z"/>
  </g>

  <!-- 마이크 음소거 버튼 -->
  <rect x="383" y="321" width="34" height="9" rx="4.5" fill="#2e2e33" stroke="#4d4d55" stroke-width="0.8"/>
</svg>
