<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 560" width="800" height="560" role="img"
     aria-labelledby="title desc">
  <title id="title">자전거를 탄 펠리칸</title>
  <desc id="desc">헬멧을 쓴 흰 펠리칸이 청록색 자전거를 타고 풀밭 위를 달리는 그림</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0fb"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <radialGradient id="body-shade" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ded2"/>
    </radialGradient>

    <!-- 바퀴 하나: 타이어, 림, 바큇살, 허브 -->
    <g id="wheel">
      <circle r="85" fill="none" stroke="#2f2f2f" stroke-width="11"/>
      <circle r="76" fill="none" stroke="#c9c9c9" stroke-width="4"/>
      <g stroke="#9c9c9c" stroke-width="1.6">
        <line x1="0" y1="-76" x2="0" y2="76"/>
        <line x1="-76" y1="0" x2="76" y2="0"/>
        <line x1="-38" y1="-65.8" x2="38" y2="65.8"/>
        <line x1="-65.8" y1="-38" x2="65.8" y2="38"/>
        <line x1="38" y1="-65.8" x2="-38" y2="65.8"/>
        <line x1="65.8" y1="-38" x2="-65.8" y2="38"/>
      </g>
      <circle r="9" fill="#7a7a7a" stroke="#3a3a3a" stroke-width="3"/>
    </g>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="700" cy="88" r="52" fill="#ffd166" opacity="0.28"/>
  <circle cx="700" cy="88" r="36" fill="#ffd166"/>
  <g fill="#ffffff" opacity="0.92">
    <circle cx="118" cy="104" r="22"/>
    <circle cx="146" cy="92" r="28"/>
    <circle cx="176" cy="104" r="20"/>
    <rect x="98" y="104" width="98" height="20" rx="10"/>
    <circle cx="262" cy="56" r="16"/>
    <circle cx="284" cy="46" r="21"/>
    <circle cx="308" cy="56" r="15"/>
    <rect x="248" y="56" width="74" height="16" rx="8"/>
  </g>
  <rect x="0" y="505" width="800" height="55" fill="#a9d86f"/>
  <rect x="0" y="503" width="800" height="5" fill="#7fb84f"/>
  <!-- 풀 포기 -->
  <g stroke="#6da443" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60 505 l-4 -12 M66 505 l2 -14 M72 505 l6 -10"/>
    <path d="M420 505 l-4 -12 M426 505 l2 -14 M432 505 l6 -10"/>
    <path d="M740 505 l-4 -12 M746 505 l2 -14 M752 505 l6 -10"/>
  </g>
  <!-- 속도선 -->
  <g stroke="#9fc4e0" stroke-width="4" stroke-linecap="round">
    <line x1="30" y1="372" x2="92" y2="372"/>
    <line x1="14" y1="404" x2="84" y2="404"/>
    <line x1="34" y1="436" x2="96" y2="436"/>
  </g>
  <!-- 바퀴 그림자 -->
  <ellipse cx="190" cy="507" rx="78" ry="7" fill="#000" opacity="0.13"/>
  <ellipse cx="600" cy="507" rx="78" ry="7" fill="#000" opacity="0.13"/>

  <!-- 먼 쪽 다리와 크랭크 (프레임 뒤) -->
  <line x1="365" y1="435" x2="328" y2="409" stroke="#5a5a5a" stroke-width="6" stroke-linecap="round"/>
  <rect x="314" y="404" width="26" height="9" rx="3" fill="#444"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M296 226 L300 332" stroke="#3b3b3b" stroke-width="18"/>
    <path d="M296 226 L300 332" stroke="#d9d4c7" stroke-width="12"/>
    <path d="M300 332 L330 408" stroke="#3b3b3b" stroke-width="11"/>
    <path d="M300 332 L330 408" stroke="#c97a2c" stroke-width="7"/>
  </g>

  <!-- 바퀴 -->
  <use xlink:href="#wheel" x="190" y="420"/>
  <use xlink:href="#wheel" x="600" y="420"/>
  <circle cx="190" cy="420" r="14" fill="none" stroke="#555" stroke-width="5"/>

  <!-- 체인 -->
  <g stroke="#4a4a4a" stroke-width="3" stroke-dasharray="4 3" fill="none">
    <line x1="190" y1="406" x2="365" y2="405"/>
    <line x1="190" y1="434" x2="365" y2="465"/>
  </g>

  <!-- 프레임 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 265 L540 265 L555 310 L365 435 Z M300 265 L190 420 L365 435 M555 310 L600 420 M300 265 L290 236 M540 265 L536 246"
          stroke="#1b6b61" stroke-width="14"/>
    <path d="M300 265 L540 265 L555 310 L365 435 Z M300 265 L190 420 L365 435 M555 310 L600 420 M300 265 L290 236 M540 265 L536 246"
          stroke="#2a9d8f" stroke-width="9"/>
    <!-- 핸들바 -->
    <path d="M536 246 Q522 230 495 237" stroke="#2b2b2b" stroke-width="7"/>
    <line x1="500" y1="236" x2="482" y2="239" stroke="#1a1a1a" stroke-width="11"/>
  </g>
  <!-- 안장 -->
  <path d="M245 234 Q248 222 274 223 L322 226 Q332 230 320 238 L256 242 Q242 242 245 234 Z"
        fill="#3a2e2a" stroke="#1f1714" stroke-width="2"/>

  <!-- 체인링과 가까운 쪽 크랭크 -->
  <circle cx="365" cy="435" r="30" fill="none" stroke="#444" stroke-width="5"/>
  <circle cx="365" cy="435" r="6" fill="#333"/>
  <line x1="365" y1="435" x2="402" y2="461" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="389" y="456" width="28" height="10" rx="3" fill="#222"/>

  <!-- 펠리칸 -->
  <!-- 꼬리 -->
  <path d="M240 150 L165 125 L185 158 L160 170 L190 178 L170 200 L242 200 Z"
        fill="#f3efe4" stroke="#3b3b3b" stroke-width="3" stroke-linejoin="round"/>
  <!-- 가까운 쪽 허벅지(깃털): 몸통 아래에 깔려 자연스럽게 이어짐 -->
  <path d="M286 205 L328 208 L342 346 Q332 364 316 350 Z"
        fill="#efeadd" stroke="#3b3b3b" stroke-width="3" stroke-linejoin="round"/>
  <!-- 몸통 -->
  <ellipse cx="300" cy="175" rx="78" ry="56" fill="url(#body-shade)" stroke="#3b3b3b" stroke-width="3"/>
  <!-- 정강이 + 물갈퀴 발 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M329 352 L402 461" stroke="#3b3b3b" stroke-width="11"/>
    <path d="M329 352 L402 461" stroke="#e8903a" stroke-width="7"/>
  </g>
  <path d="M386 461 L420 450 L424 461 L416 470 Z" fill="#e8903a" stroke="#3b3b3b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 목 -->
  <path d="M350 150 C388 142 396 100 440 84" fill="none" stroke="#3b3b3b" stroke-width="36" stroke-linecap="round"/>
  <path d="M350 150 C388 142 396 100 440 84" fill="none" stroke="#f7f3ea" stroke-width="30" stroke-linecap="round"/>
  <!-- 머리 -->
  <circle cx="445" cy="80" r="30" fill="#f7f3ea" stroke="#3b3b3b" stroke-width="3"/>
  <!-- 부리 -->
  <path d="M466 68 Q532 82 594 108 Q600 116 590 122 Q526 100 468 92 Z"
        fill="#f4a53a" stroke="#3b3b3b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M468 94 Q508 178 589 121 Z"
        fill="#f7b955" stroke="#3b3b3b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 눈 -->
  <circle cx="453" cy="82" r="8" fill="#fff" stroke="#3b3b3b" stroke-width="2"/>
  <circle cx="455" cy="83" r="4.5" fill="#1a1a1a"/>
  <circle cx="457" cy="81" r="1.6" fill="#fff"/>
  <!-- 헬멧 -->
  <path d="M411 66 A35 35 0 0 1 479 61 Q446 69 411 66 Z"
        fill="#ef476f" stroke="#3b3b3b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M428 48 L432 62 M446 40 L447 58 M464 44 L460 58" stroke="#b52f52" stroke-width="3" stroke-linecap="round"/>
  <path d="M418 88 Q430 112 448 108" fill="none" stroke="#3b3b3b" stroke-width="2"/>
  <!-- 날개 -->
  <path d="M332 142 C392 150 450 196 490 232 C493 242 485 249 474 244 C440 212 386 194 330 180 Q318 160 332 142 Z"
        fill="#ece7da" stroke="#3b3b3b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M356 160 C400 176 436 200 466 226" fill="none" stroke="#c9c3b4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M452 222 L470 236 M462 215 L482 231" fill="none" stroke="#3b3b3b" stroke-width="2" stroke-linecap="round"/>
</svg>
