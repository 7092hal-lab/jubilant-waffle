<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="t d">
  <title id="t">자전거를 탄 펠리칸</title>
  <desc id="d">커다란 주머니 부리를 가진 흰 펠리칸이 빨간 자전거에 앉아 오렌지색 다리로 페달을 밟으며 오른쪽으로 달린다.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcedf9"/>
      <stop offset="1" stop-color="#f6fbfe"/>
    </linearGradient>
    <!-- 바퀴: 타이어, 림, 스포크 12개, 허브 -->
    <line id="spk" x1="0" y1="0" x2="0" y2="-74" stroke="#9a9a9a" stroke-width="1.6"/>
    <g id="wheel">
      <circle r="85" fill="none" stroke="#2f2f2f" stroke-width="10"/>
      <circle r="74" fill="none" stroke="#cfcfcf" stroke-width="3"/>
      <use xlink:href="#spk"/>
      <use xlink:href="#spk" transform="rotate(30)"/>
      <use xlink:href="#spk" transform="rotate(60)"/>
      <use xlink:href="#spk" transform="rotate(90)"/>
      <use xlink:href="#spk" transform="rotate(120)"/>
      <use xlink:href="#spk" transform="rotate(150)"/>
      <use xlink:href="#spk" transform="rotate(180)"/>
      <use xlink:href="#spk" transform="rotate(210)"/>
      <use xlink:href="#spk" transform="rotate(240)"/>
      <use xlink:href="#spk" transform="rotate(270)"/>
      <use xlink:href="#spk" transform="rotate(300)"/>
      <use xlink:href="#spk" transform="rotate(330)"/>
      <circle r="7" fill="#555"/>
    </g>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="540" fill="url(#sky)"/>
  <circle cx="690" cy="106" r="40" fill="#ffd978"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="112" rx="38" ry="18"/>
    <ellipse cx="100" cy="104" rx="22" ry="16"/>
    <ellipse cx="142" cy="102" rx="26" ry="18"/>
    <ellipse cx="560" cy="62" rx="34" ry="15"/>
    <ellipse cx="542" cy="54" rx="20" ry="14"/>
    <ellipse cx="578" cy="54" rx="22" ry="15"/>
  </g>
  <rect y="465" width="800" height="75" fill="#cfe0a8"/>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#9fbf78" stroke-width="3"/>

  <g transform="translate(0,20)">
    <!-- 그림자, 속도선 -->
    <ellipse cx="385" cy="447" rx="215" ry="6" fill="#000" opacity="0.08"/>
    <g stroke="#a9c4d6" stroke-width="4" stroke-linecap="round">
      <line x1="95" y1="300" x2="150" y2="300"/>
      <line x1="80" y1="330" x2="140" y2="330"/>
      <line x1="100" y1="360" x2="145" y2="360"/>
    </g>

    <!-- 먼 쪽 크랭크, 페달, 다리 (자전거 뒤) -->
    <line x1="355" y1="372" x2="321" y2="348" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <rect x="310" y="344.5" width="22" height="7" rx="2" fill="#333"/>
    <path d="M 312 214 L 298 290 L 319 343" fill="none" stroke="#b06a26" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 312 214 L 298 290 L 319 343" fill="none" stroke="#d3812c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 306 345 L 310 336 L 334 332 L 340 338 L 343 345 Z" fill="#d3812c" stroke="#b06a26" stroke-width="2" stroke-linejoin="round"/>

    <!-- 바퀴 -->
    <use xlink:href="#wheel" x="215" y="360"/>
    <use xlink:href="#wheel" x="555" y="360"/>

    <!-- 프레임 -->
    <g fill="none" stroke="#d64545" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 215 360 L 355 372 L 318 250 Z"/>
      <path d="M 318 250 L 490 240"/>
      <path d="M 503 268 L 355 372"/>
      <path d="M 503 268 Q 520 300 555 360"/>
      <path d="M 490 240 L 503 268" stroke-width="11"/>
    </g>
    <line x1="318" y1="250" x2="308" y2="222" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <path d="M 268 226 Q 272 212 298 213 L 338 216 Q 346 222 336 227 L 292 231 Q 270 234 268 226 Z" fill="#333"/>

    <!-- 체인, 체인링, 가까운 크랭크 -->
    <circle cx="215" cy="360" r="13" fill="none" stroke="#555" stroke-width="3"/>
    <path d="M 215 347 L 355 342 M 215 373 L 355 402" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="5 3"/>
    <circle cx="355" cy="372" r="30" fill="none" stroke="#555" stroke-width="4"/>
    <circle cx="355" cy="372" r="8" fill="#555"/>
    <line x1="355" y1="372" x2="389" y2="396" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <rect x="378" y="392.5" width="22" height="7" rx="2" fill="#333"/>

    <!-- 핸들바 -->
    <path d="M 490 240 L 486 224 Q 484 212 466 212 L 450 212" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <line x1="462" y1="212" x2="448" y2="212" stroke="#222" stroke-width="8" stroke-linecap="round"/>

    <!-- 펠리칸: 먼 쪽 날개 (몸 뒤) -->
    <path d="M 322 126 C 352 124 400 156 448 190 L 456 202 C 432 208 388 194 344 178 C 320 170 310 148 322 126 Z"
          fill="#e9e3d6" stroke="#b8b0a2" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 펠리칸: 몸, 목, 머리, 꼬리 (윤곽층 → 채움층) -->
    <g fill="#b8b0a2" stroke="#b8b0a2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 340 146 C 372 132 392 118 402 98 C 410 82 420 70 438 70" fill="none" stroke-width="30"/>
      <circle cx="438" cy="70" r="29.5" stroke="none"/>
      <path d="M 238 146 C 210 144 190 156 186 170 C 190 184 212 196 240 196 Z" stroke-width="5"/>
      <ellipse cx="300" cy="172" rx="82.5" ry="56.5" transform="rotate(-6 300 172)" stroke="none"/>
    </g>
    <g fill="#fbf8f1" stroke="#fbf8f1" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 238 146 C 210 144 190 156 186 170 C 190 184 212 196 240 196 Z" stroke="none"/>
      <ellipse cx="300" cy="172" rx="80" ry="54" transform="rotate(-6 300 172)" fill="#ebe5d7" stroke="none"/>
      <ellipse cx="300" cy="166" rx="77" ry="50" transform="rotate(-6 300 166)" stroke="none"/>
      <path d="M 340 146 C 372 132 392 118 402 98 C 410 82 420 70 438 70" fill="none" stroke-width="25"/>
      <circle cx="438" cy="70" r="27" stroke="none"/>
    </g>
    <!-- 꼬리 깃 선, 뒷머리 깃 -->
    <path d="M 234 162 L 200 164 M 236 180 L 202 182" fill="none" stroke="#d8d1c3" stroke-width="2"/>
    <path d="M 420 47 q -9 -11 -17 -5 M 415 55 q -12 -7 -17 1" fill="none" stroke="#b8b0a2" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 부리: 위턱, 주머니 -->
    <path d="M 456 82 C 468 134 530 142 581 101 Z" fill="#ef9a3c" stroke="#c6782a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 452 54 L 583 86 C 593 90 591 100 581 101 L 456 82 Z" fill="#f5b544" stroke="#c6782a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 464 61 L 574 88" fill="none" stroke="#c6782a" stroke-width="1.2" opacity="0.5"/>

    <!-- 눈 -->
    <circle cx="445" cy="61" r="9.5" fill="#f6d58a"/>
    <circle cx="447" cy="62" r="4.5" fill="#262626"/>
    <circle cx="448.5" cy="60.5" r="1.5" fill="#fff"/>

    <!-- 가까운 쪽 날개 (핸들바를 잡는다) -->
    <path d="M 326 138 C 356 136 404 168 450 202 L 460 214 C 436 222 390 206 346 190 C 322 182 314 160 326 138 Z"
          fill="#fbf8f1" stroke="#b8b0a2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 345 160 C 380 172 420 192 448 208 M 340 178 C 370 184 400 196 430 210" fill="none" stroke="#d8d1c3" stroke-width="2"/>

    <!-- 가까운 쪽 다리와 발 -->
    <path d="M 326 214 L 342 302 L 387 391" fill="none" stroke="#c6782a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 326 214 L 342 302 L 387 391" fill="none" stroke="#ef9a3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 374 393 L 378 384 L 402 380 L 408 386 L 411 393 Z" fill="#ef9a3c" stroke="#c6782a" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
