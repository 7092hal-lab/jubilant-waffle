<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">PS5 DualSense Wireless Controller</title>
  <desc id="desc">Front view illustration of the Sony PlayStation 5 DualSense controller in white: touchpad with light bars, Create and Options buttons, d-pad, triangle/circle/cross/square buttons, PS button, mute button, two analog sticks, L1/R1 bumpers and L2/R2 triggers.</desc>

  <defs>
    <!-- body & surface shading -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eaedf0"/>
    </linearGradient>
    <linearGradient id="blackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e32"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="triggerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f2f4"/>
      <stop offset="1" stop-color="#cfd3d8"/>
    </linearGradient>
    <linearGradient id="bumperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e5e9"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#e4e7eb"/>
    </linearGradient>
    <radialGradient id="btnGrad" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e1e4e8"/>
    </radialGradient>
    <radialGradient id="wellGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#0d0e10"/>
      <stop offset="1" stop-color="#2a2c30"/>
    </radialGradient>
    <radialGradient id="capGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="0.78" stop-color="#26272b"/>
      <stop offset="1" stop-color="#3c3e43"/>
    </radialGradient>
    <radialGradient id="capRim" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#45474c"/>
      <stop offset="1" stop-color="#232427"/>
    </radialGradient>
    <radialGradient id="dipGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8dce2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d8dce2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dpadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e6e9ed"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="innerSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <clipPath id="bodyClip"><path d="M 400 100 C 460 100 528 94 588 92 C 650 90 702 110 724 162 C 744 204 754 292 752 372 C 750 432 738 486 706 516 C 684 536 654 538 628 532 C 598 526 566 524 550 508 C 534 492 510 464 488 438 C 466 412 436 400 400 400 C 364 400 334 412 312 438 C 290 464 266 492 250 508 C 234 524 202 526 172 532 C 146 538 116 536 94 516 C 62 486 50 432 48 372 C 46 292 56 204 76 162 C 98 110 150 90 212 92 C 272 94 340 100 400 100 Z"/></clipPath>

    <path id="trigger" d="M 510 120 C 516 86 548 64 606 62 C 666 60 698 82 708 126 L 708 140 L 510 140 Z"/>
    <path id="bumper" d="M 488 118 C 494 92 540 80 600 80 C 660 80 700 92 712 120 L 712 140 L 488 140 Z"/>
    <path id="dpadArm" d="M -7 -5 L 7 -5 L 16 -14 L 16 -41 Q 16 -49 8 -49 L -8 -49 Q -16 -49 -16 -41 L -16 -14 Z"/>
    <path id="lightbar" d="M 272.6 134.6 L 286.4 241.7 Q 289.2 263.5 311.2 263.5 L 329.2 263.5"/>
  </defs>

  <!-- ============ shoulders (behind the body) ============ -->
  <g id="triggers" fill="url(#triggerGrad)" stroke="#b9bec5" stroke-width="1.5">
    <use xlink:href="#trigger"/>
    <use xlink:href="#trigger" transform="translate(800 0) scale(-1 1)"/>
  </g>
  <g id="bumpers" fill="url(#bumperGrad)" stroke="#c3c8ce" stroke-width="1.5">
    <use xlink:href="#bumper"/>
    <use xlink:href="#bumper" transform="translate(800 0) scale(-1 1)"/>
  </g>

  <!-- ============ body ============ -->
  <g id="body" filter="url(#shadow)">
    <path d="M 400 100 C 460 100 528 94 588 92 C 650 90 702 110 724 162 C 744 204 754 292 752 372 C 750 432 738 486 706 516 C 684 536 654 538 628 532 C 598 526 566 524 550 508 C 534 492 510 464 488 438 C 466 412 436 400 400 400 C 364 400 334 412 312 438 C 290 464 266 492 250 508 C 234 524 202 526 172 532 C 146 538 116 536 94 516 C 62 486 50 432 48 372 C 46 292 56 204 76 162 C 98 110 150 90 212 92 C 272 94 340 100 400 100 Z" fill="url(#bodyGrad)" stroke="#c6cbd1" stroke-width="2"/>
  </g>

  <!-- black middle section (clipped to the body) -->
  <g id="middle" clip-path="url(#bodyClip)">
    <path d="M 400 266 C 440 266 460 274 478 274 C 490 274 494.9 273.6 507 266.6 A 72 72 0 0 1 553 400.3 C 539 402 518 436 526 446 C 538 468 548 494 554 512 L 542 520 C 526 498 502 470 480 446 C 458 420 436 408 400 408 C 364 408 342 420 320 446 C 298 470 274 498 258 520 L 246 512 C 252 494 262 468 274 446 C 282 436 261 402 247 400.3 A 72 72 0 0 1 293 266.6 C 305.1 273.6 310 274 322 274 C 340 274 360 266 400 266 Z" fill="url(#blackGrad)"/>
    <path d="M 400 266 C 440 266 460 274 478 274 C 490 274 494.9 273.6 507 266.6 A 72 72 0 0 1 553 400.3 C 539 402 518 436 526 446 C 538 468 548 494 554 512 L 542 520 C 526 498 502 470 480 446 C 458 420 436 408 400 408 C 364 408 342 420 320 446 C 298 470 274 498 258 520 L 246 512 C 252 494 262 468 274 446 C 282 436 261 402 247 400.3 A 72 72 0 0 1 293 266.6 C 305.1 273.6 310 274 322 274 C 340 274 360 266 400 266 Z" fill="none" stroke="#0b0c0d" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- ============ touchpad + light bars ============ -->
  <g id="touchpad">
    <path d="M 278.5 137.9 Q 277 126 289 126 L 511 126 Q 523 126 521.5 137.9 L 508.3 240.1 Q 506 258 488 258 L 312 258 Q 294 258 291.7 240.1 Z" fill="url(#padGrad)" stroke="#cdd2d8" stroke-width="1.5"/>
    <path d="M 284.2 140.9 Q 283 132 292 132 L 508 132 Q 517 132 515.8 140.9 L 503 237.1 Q 501 252 486 252 L 314 252 Q 299 252 297 237.1 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
  <g id="lightbars" fill="none" stroke-linecap="round">
    <g stroke="#58c8ff" stroke-width="7" opacity="0.55" filter="url(#glow)">
      <use xlink:href="#lightbar"/>
      <use xlink:href="#lightbar" transform="translate(800 0) scale(-1 1)"/>
    </g>
    <g stroke="#bfeaff" stroke-width="3">
      <use xlink:href="#lightbar"/>
      <use xlink:href="#lightbar" transform="translate(800 0) scale(-1 1)"/>
    </g>
  </g>

  <!-- ============ Create / Options ============ -->
  <g id="create" transform="translate(257 154) rotate(-12)">
    <rect x="-8" y="-19" width="16" height="38" rx="8" fill="url(#btnGrad)" stroke="#c3c8ce" stroke-width="1.3"/>
    <g stroke="#7a7f86" stroke-width="1.6" stroke-linecap="round">
      <line x1="-3.5" y1="-4" x2="0.5" y2="-4"/>
      <line x1="-3.5" y1="0" x2="2.5" y2="0"/>
      <line x1="-3.5" y1="4" x2="4" y2="4"/>
    </g>
  </g>
  <g id="options" transform="translate(543 154) rotate(12)">
    <rect x="-8" y="-19" width="16" height="38" rx="8" fill="url(#btnGrad)" stroke="#c3c8ce" stroke-width="1.3"/>
    <g stroke="#7a7f86" stroke-width="1.6" stroke-linecap="round">
      <line x1="-4" y1="-4" x2="4" y2="-4"/>
      <line x1="-4" y1="0" x2="4" y2="0"/>
      <line x1="-4" y1="4" x2="4" y2="4"/>
    </g>
  </g>

  <!-- ============ D-pad ============ -->
  <g id="dpad" transform="translate(172 224)">
    <circle r="10" fill="#d9dde3"/>
    <g fill="url(#dpadGrad)" stroke="#b3b9c0" stroke-width="1.6" stroke-linejoin="round">
      <use xlink:href="#dpadArm"/>
      <use xlink:href="#dpadArm" transform="rotate(90)"/>
      <use xlink:href="#dpadArm" transform="rotate(180)"/>
      <use xlink:href="#dpadArm" transform="rotate(270)"/>
    </g>
    <!-- soft concave shading on each arm -->
    <g fill="url(#dipGrad)">
      <ellipse cx="0" cy="-30" rx="11" ry="16"/>
      <ellipse cx="0" cy="30" rx="11" ry="16"/>
      <ellipse cx="-30" cy="0" rx="16" ry="11"/>
      <ellipse cx="30" cy="0" rx="16" ry="11"/>
    </g>
  </g>

  <!-- ============ face buttons ============ -->
  <g id="face-buttons" transform="translate(628 224)">
    <g fill="url(#btnGrad)" stroke="#c3c8ce" stroke-width="1.4">
      <circle cx="0" cy="-46" r="20"/>
      <circle cx="46" cy="0" r="20"/>
      <circle cx="0" cy="46" r="20"/>
      <circle cx="-46" cy="0" r="20"/>
    </g>
    <g fill="none" stroke="#6f757c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <!-- triangle -->
      <path d="M 0 -55 L 9.5 -39 L -9.5 -39 Z"/>
      <!-- circle -->
      <circle cx="46" cy="0" r="8.5"/>
      <!-- cross -->
      <path d="M -8 38 L 8 54 M 8 38 L -8 54"/>
      <!-- square -->
      <rect x="-54" y="-8" width="16" height="16" rx="1.5"/>
    </g>
  </g>

  <!-- ============ speaker, PS button, mute ============ -->
  <g id="speaker" fill="#474b52">
      <circle cx="365" cy="277" r="1.5"/>
      <circle cx="372" cy="277" r="1.5"/>
      <circle cx="379" cy="277" r="1.5"/>
      <circle cx="386" cy="277" r="1.5"/>
      <circle cx="393" cy="277" r="1.5"/>
      <circle cx="400" cy="277" r="1.5"/>
      <circle cx="407" cy="277" r="1.5"/>
      <circle cx="414" cy="277" r="1.5"/>
      <circle cx="421" cy="277" r="1.5"/>
      <circle cx="428" cy="277" r="1.5"/>
      <circle cx="435" cy="277" r="1.5"/>
      <circle cx="358" cy="284" r="1.5"/>
      <circle cx="365" cy="284" r="1.5"/>
      <circle cx="372" cy="284" r="1.5"/>
      <circle cx="379" cy="284" r="1.5"/>
      <circle cx="386" cy="284" r="1.5"/>
      <circle cx="393" cy="284" r="1.5"/>
      <circle cx="400" cy="284" r="1.5"/>
      <circle cx="407" cy="284" r="1.5"/>
      <circle cx="414" cy="284" r="1.5"/>
      <circle cx="421" cy="284" r="1.5"/>
      <circle cx="428" cy="284" r="1.5"/>
      <circle cx="435" cy="284" r="1.5"/>
      <circle cx="442" cy="284" r="1.5"/>
      <circle cx="358" cy="291" r="1.5"/>
      <circle cx="365" cy="291" r="1.5"/>
      <circle cx="372" cy="291" r="1.5"/>
      <circle cx="379" cy="291" r="1.5"/>
      <circle cx="386" cy="291" r="1.5"/>
      <circle cx="393" cy="291" r="1.5"/>
      <circle cx="400" cy="291" r="1.5"/>
      <circle cx="407" cy="291" r="1.5"/>
      <circle cx="414" cy="291" r="1.5"/>
      <circle cx="421" cy="291" r="1.5"/>
      <circle cx="428" cy="291" r="1.5"/>
      <circle cx="435" cy="291" r="1.5"/>
      <circle cx="442" cy="291" r="1.5"/>
      <circle cx="365" cy="298" r="1.5"/>
      <circle cx="372" cy="298" r="1.5"/>
      <circle cx="379" cy="298" r="1.5"/>
      <circle cx="386" cy="298" r="1.5"/>
      <circle cx="393" cy="298" r="1.5"/>
      <circle cx="400" cy="298" r="1.5"/>
      <circle cx="407" cy="298" r="1.5"/>
      <circle cx="414" cy="298" r="1.5"/>
      <circle cx="421" cy="298" r="1.5"/>
      <circle cx="428" cy="298" r="1.5"/>
      <circle cx="435" cy="298" r="1.5"/>
  </g>
  <g id="ps-button" transform="translate(400 322)">
    <circle r="16" fill="#111214" stroke="#303236" stroke-width="1.5"/>
    <!-- simplified PlayStation mark -->
    <g fill="#9aa0a8">
      <path d="M -6.5 -10.5 L -1.5 -9.2 L -1.5 9.5 L -6.5 11 Z"/>
      <path d="M -1.5 -9.2 C 5.5 -7.5 8 -4 8 -0.5 C 8 2.5 5.5 4.6 1.4 4.6 L 1.4 1.2 C 3.6 1.2 4.6 0.3 4.6 -1.6 C 4.6 -3.6 3.4 -5 1.4 -5.8 L 1.4 2.2 L -1.5 2.9 Z"/>
      <path d="M -7 5.6 L -7 8.4 L -11.5 9.6 C -12.7 10 -12.4 10.8 -11 11 L -7 11.6 L -7 13.4 L -12.5 12.6 C -15.4 12.2 -15.4 10.2 -12.5 9.2 Z"/>
      <path d="M -1.5 11.8 L 1.4 11.3 L 1.4 8.8 L 10.4 7.4 C 13.4 6.9 13.8 8.6 11.4 9.4 L 1.4 12.5 L -1.5 13.3 Z"/>
    </g>
  </g>
  <g id="mute">
    <rect x="384" y="356" width="32" height="7" rx="3.5" fill="#2a2c30" stroke="#404349" stroke-width="1"/>
    <rect x="396" y="358.2" width="8" height="2.6" rx="1.3" fill="#4a4d53"/>
  </g>

  <!-- ============ analog sticks ============ -->
  <g id="sticks">
    <g id="stick-left" transform="translate(257 329)">
      <circle r="55" fill="url(#wellGrad)"/>
      <circle r="44" fill="#0a0b0c"/>
      <circle r="38" fill="url(#capRim)"/>
      <circle r="38" fill="none" stroke="#3a3c41" stroke-width="2.4" stroke-dasharray="1.6 2.6" opacity="0.9"/>
      <circle r="30" fill="url(#capGrad)"/>
      <circle r="30" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
    </g>
    <g id="stick-right" transform="translate(543 329)">
      <circle r="55" fill="url(#wellGrad)"/>
      <circle r="44" fill="#0a0b0c"/>
      <circle r="38" fill="url(#capRim)"/>
      <circle r="38" fill="none" stroke="#3a3c41" stroke-width="2.4" stroke-dasharray="1.6 2.6" opacity="0.9"/>
      <circle r="30" fill="url(#capGrad)"/>
      <circle r="30" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
</svg>
